{% extends "base.html" %}

{% block title %}
Dashboard - Task Manager
{% endblock %}

{% block content %}

<div class="dashboard">

    <header class="navbar">

        <h1>Task Manager</h1>

        <button id="logout-btn">
            Logout
        </button>

    </header>


    <main class="dashboard-content">

        <section class="create-task">

            <h2>Create Task</h2>

            <form id="task-form">

                <input
                    type="text"
                    id="title"
                    placeholder="Task title"
                    required
                >

                <textarea
                    id="description"
                    placeholder="Task description"
                ></textarea>

                <select id="status">

                    <option value="pending">
                        Pending
                    </option>

                    <option value="in_progress">
                        In Progress
                    </option>

                    <option value="completed">
                        Completed
                    </option>

                </select>

                <select id="priority">

                    <option value="low">
                        Low
                    </option>

                    <option value="medium" selected>
                        Medium
                    </option>

                    <option value="high">
                        High
                    </option>

                </select>

                <input
                    type="date"
                    id="due_date"
                >

                <button type="submit">
                    Add Task
                </button>

            </form>

        </section>


        <section class="task-section">

            <div class="task-header">

                <h2>My Tasks</h2>

                <button id="refresh-btn">
                    Refresh
                </button>

            </div>

            <div id="tasks-container"></div>

        </section>

    </main>

</div>

<script src="{{ url_for('static', path='js/dashboard.js') }}"></script>

{% endblock %}
