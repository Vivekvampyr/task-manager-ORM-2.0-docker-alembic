{% extends "base.html" %}

{% block title %}
Register - Task Manager
{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Create Account</h1>
        <p class="subtitle">
            Create your Task Manager account
        </p>

        <form id="register-form">

            <div class="form-row">

                <div class="form-group">
                    <label>First Name</label>
                    <input
                        type="text"
                        id="first_name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Last Name</label>
                    <input
                        type="text"
                        id="last_name"
                        required
                    >
                </div>

            </div>

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    required
                >
            </div>

            <button type="submit">
                Register
            </button>

        </form>

        <p id="message"></p>

        <p class="auth-link">
            Already have an account?
            <a href="/login">Login</a>
        </p>

    </div>

</div>

<script src="{{ url_for('static', path='js/register.js') }}"></script>

{% endblock %}
